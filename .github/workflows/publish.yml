name: Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json

permissions:
  contents: write
  id-token: write

jobs:
  marketplace:
    environment: marketplace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Show Marketplace identity ID
        if: github.event_name == 'workflow_dispatch'
        run: az rest --url https://app.vssps.visualstudio.com/_apis/profile/profiles/me --resource 499b84ac-1321-427f-aa17-267ca6975798 --query id --output tsv
      - uses: pnpm/action-setup@v4
        if: github.event_name == 'push'
      - uses: actions/setup-node@v4
        if: github.event_name == 'push'
        with:
          node-version: 22
          cache: pnpm
      - name: Publish and tag
        if: github.event_name == 'push'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")"
          pnpm install --frozen-lockfile
          pnpm check
          pnpm exec vsce publish --azure-credential --no-dependencies
          git tag "v$VERSION"
          git push origin "v$VERSION"
