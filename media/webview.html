<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src 'nonce-{{nonce}}';"
    />
    <link rel="stylesheet" href="{{styleUri}}" />
  </head>
  <body>
    <main>
      <section id="projects">
        <header>
          <span class="heading">Projects / Workspaces</span
          ><button
            class="icon"
            id="add"
            title="Add Workspace"
            aria-label="Add Workspace"
          >
            ＋</button
          ><button
            class="icon"
            id="refresh"
            title="Refresh"
            aria-label="Refresh"
          >
            ↻
          </button>
        </header>
        <div class="content" id="project-list"></div>
      </section>
      <div
        class="resizer"
        data-before="projects"
        data-after="threads"
        role="separator"
        aria-label="Resize Projects and Threads"
        aria-orientation="horizontal"
        tabindex="0"
      ></div>
      <section id="threads">
        <header>
          <span class="heading" id="threads-title">Threads</span
          ><span
            id="threads-attention"
            class="attention-badge"
            role="status"
            hidden
          ></span
          ><button
            class="icon"
            id="new-thread"
            title="New Thread"
            aria-label="New Thread"
          >
            ＋
          </button>
        </header>
        <div class="content" id="thread-list"></div>
      </section>
      <div
        class="resizer"
        data-before="threads"
        data-after="thread"
        role="separator"
        aria-label="Resize Threads and Thread"
        aria-orientation="horizontal"
        tabindex="0"
      ></div>
      <section id="thread">
        <header id="thread-header">
          <span class="heading" id="thread-title">Thread</span
          ><button
            class="icon"
            id="rename-thread"
            title="Rename Thread"
            aria-label="Rename Thread"
          >
            ✎
          </button>
        </header>
        <div id="chat">
          <div id="transcript"></div>
          <div
            id="processing"
            role="status"
            aria-label="Agent is working"
            hidden
          >
            <span id="braille" aria-hidden="true">⠋</span>
          </div>
          <div id="notice"></div>
          <div id="actions"></div>
          <div id="interaction"></div>
        </div>
        <div id="plan" hidden>
          <div id="plan-title"></div>
          <pre id="plan-body"></pre>
        </div>
        <footer>
          <textarea
            id="composer"
            placeholder="Message magpi-acp — @ to include context, / for commands"
          ></textarea>
          <div class="footer-row">
            <div id="usage" hidden tabindex="0">
              <div id="usage-fill"></div>
            </div>
            <div id="configs"></div>
            <button class="action" id="send" title="Send" aria-label="Send">
              <svg
                class="lucide send-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <path d="m5 12 7-7 7 7"></path>
                <path d="M12 19V5"></path></svg
              ><svg
                class="lucide stop-icon"
                viewBox="0 0 24 24"
                aria-hidden="true"
              >
                <rect width="18" height="18" x="3" y="3" rx="2"></rect>
              </svg>
            </button>
          </div>
        </footer>
      </section>
    </main>
    <script nonce="{{nonce}}" src="{{scriptUri}}"></script>
  </body>
</html>
